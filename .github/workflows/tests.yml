name: Gateway tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test-only-root-password
          MARIADB_DATABASE: support_hub_test
          MARIADB_USER: hub_test
          MARIADB_PASSWORD: test-only-db-password
        ports:
          - 3306:3306
        options: --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q support_hub tests
      - name: Unit and integration tests
        env:
          HUB_TEST_REDIS_URL: redis://127.0.0.1:6379/15
          HUB_TEST_DB: '1'
          HUB_DB_HOST: 127.0.0.1
          HUB_DB_NAME: support_hub_test
          HUB_DB_USER: hub_test
          HUB_DB_PASSWORD: test-only-db-password
        run: |
          export HUB_ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')
          python -m unittest discover -s tests -v
